name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Lets you trigger manually from the Actions tab.

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Needed so the build can attach the APK to a GitHub Release.
    permissions:
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache Buildozer build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-

      - name: Install Buildozer + Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build debug APK
        run: |
          # `yes` auto-accepts the interactive Android SDK license prompts that
          # Buildozer surfaces on a fresh runner. Without this the SDK install
          # silently skips build-tools and the build fails with "aidl not found".
          yes | buildozer android debug
          ls -lh bin/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pglu-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the freshly built APK to the GitHub Release so it's always
      # downloadable from the repo (not just as a 30-day workflow artifact).
      # Updates the existing tagged release in place; creates it if missing.
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls bin/*.apk | head -1)
          TAG=v0.1.0
          echo "Publishing $APK to release $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Pglu $TAG" \
              --notes "Automated Android build of Pglu. Min Android 7.0 (API 24), arm64 + arm32."
          fi
